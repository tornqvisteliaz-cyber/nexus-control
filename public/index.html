<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Control</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="shell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand" onclick="nav('dashboard')">
        <div class="brand-logo">✈</div>
        <div>
          <div class="brand-name">Nexus</div>
          <div class="brand-sub">Control</div>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-group">
          <button class="nav-btn active" data-page="dashboard">
            <span class="ni">⌂</span> Dashboard
          </button>
          <button class="nav-btn" data-page="products">
            <span class="ni">✈</span> My Products
          </button>
          <button class="nav-btn" data-page="trailers">
            <span class="ni">▶</span> Trailers
          </button>
          <button class="nav-btn" data-page="newsletter">
            <span class="ni">✉</span> Newsletter
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Library</div>
          <button class="nav-btn" data-page="orders">
            <span class="ni">📦</span> My Orders
          </button>
          <button class="nav-btn" data-page="admin">
            <span class="ni">⚙</span> Admin
          </button>
        </div>
      </nav>

      <div class="sidebar-bottom">
        <div class="hot">
          <div class="hot-label">Hot Pick</div>
          <div class="hot-title" id="hot-title">—</div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menu-btn">☰</button>
          <div class="tabs" id="tabs">
            <button class="tab active" data-page="dashboard">Dashboard</button>
            <button class="tab" data-page="products">My Products</button>
            <button class="tab" data-page="trailers">Trailers</button>
            <button class="tab" data-page="newsletter">Newsletter</button>
          </div>
        </div>
        <div class="topbar-right">
          <div class="search">
            <span>⌕</span>
            <input id="search" type="text" placeholder="Search products..." />
          </div>
          <button class="cart-btn" id="cart-btn">
            🛒 <span id="cart-n">0</span>
          </button>
        </div>
      </header>

      <div class="page" id="page"></div>
    </div>

    <!-- CART -->
    <div class="cart" id="cart">
      <div class="cart-h">
        <strong>Cart</strong>
        <button id="cart-close">✕</button>
      </div>
      <div class="cart-body" id="cart-body"></div>
      <div class="cart-f">
        <div class="cart-total"><span>Total</span><b id="cart-total">$0</b></div>
        <button class="btn primary block" id="checkout">Checkout</button>
      </div>
    </div>
    <div class="overlay" id="overlay"></div>
  </div>

  <div id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
