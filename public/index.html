<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Control</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="app-shell">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" onclick="navigate('home')">
        <div class="brand-icon">✈</div>
        <div class="brand-text">
          <span class="brand-name">Nexus</span>
          <span class="brand-sub">Control</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <a class="nav-item active" data-page="home" href="#">
            <span class="nav-icon">⌂</span> Home
          </a>
          <a class="nav-item" data-page="aircrafts" href="#">
            <span class="nav-icon">✈</span> Aircraft
          </a>
          <a class="nav-item" data-page="trailers" href="#">
            <span class="nav-icon">▶</span> Trailers
          </a>
          <a class="nav-item" data-page="newsletter" href="#">
            <span class="nav-icon">✉</span> Newsletter
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-label">Library</div>
          <a class="nav-item" data-page="orders" href="#">
            <span class="nav-icon">📦</span> My Orders
          </a>
          <a class="nav-item" data-page="admin" href="#">
            <span class="nav-icon">⚙</span> Admin Panel
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="hot-pick" id="hot-pick">
          <div class="hot-pick-label">Today's Hot Pick</div>
          <div class="hot-pick-title">Loading...</div>
          <button class="btn-sm-outline" onclick="navigate('aircrafts')">Discover</button>
        </div>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="main-area">
      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="top-tabs" id="top-tabs">
            <button class="top-tab active" data-page="home">Home</button>
            <button class="top-tab" data-page="aircrafts">Aircraft</button>
            <button class="top-tab" data-page="trailers">Trailers</button>
            <button class="top-tab" data-page="newsletter">Newsletter</button>
          </div>
        </div>
        <div class="topbar-right">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" id="search-input" placeholder="Search aircraft..." />
          </div>
          <button class="icon-btn" id="cart-btn" title="Cart">
            🛒 <span class="cart-count" id="cart-count">0</span>
          </button>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="content" id="main-content">
        <!-- pages render here -->
      </main>
    </div>

    <!-- CART DRAWER -->
    <div class="cart-drawer" id="cart-drawer">
      <div class="cart-header">
        <h3>Cart</h3>
        <button class="icon-btn" id="close-cart">✕</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total</span>
          <strong id="cart-total">$0</strong>
        </div>
        <button class="btn-primary btn-block" id="checkout-btn">Checkout</button>
      </div>
    </div>
    <div class="cart-overlay" id="cart-overlay"></div>

  </div>

  <div id="toast-container"></div>
  <script src="/app.js"></script>
</body>
</html>
